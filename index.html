<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: transparent;
    }

    #gradient {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 0;
      transition: opacity 0.2s ease;
    }

    .overlay {
      position: relative;
      z-index: 3;
      isolation: isolate;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 100px;
      background: rgba(250, 250, 255, 0.492);
      color: white;
      transition: opacity 0.2s ease;
    }

    .ai-assistant {
      width: 448px;
      height: 565px;
      background: rgb(255, 254, 254);
      border-radius: 20px;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      box-shadow: 0 8px 24px rgba(28, 39, 76, 0.15);
    }

    #answerOverlay {
      position: absolute;
      left: 18px; right: 18px; bottom: 18px;
      padding: 12px 14px;
      background: rgba(255, 254, 254, 0.92);
      color: rgb(28, 39, 76);
      border-radius: 14px;
      font-size: 16px;
      line-height: 1.25;
      max-height: 40%;
      overflow: auto;
      z-index: 5;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      pointer-events: none;
      white-space: pre-wrap;
    }

    #answerOverlay.visible {
      opacity: 1;
      transform: translateY(0);
    }

    body.no-subtitles #answerOverlay {
      display: none !important;
    }

    #avatarCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .button_box {
      width: 460px;
      display: flex;
      flex-direction: column;
      gap: 48px;
    }

    .button {
      width: 100%;
      height: 88px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 20px 96px;
      background: rgb(255, 254, 254);
      border-radius: 20px;
      cursor: pointer;
      font-size: 20px;
      color: rgb(28, 39, 76);
      transition: transform 0.2s ease, filter 0.2s ease;
      box-shadow: 0 8px 24px rgba(28, 39, 76, 0.15);
    }

    .button_icon {
      width: 55px; height: 55px;
      flex-shrink: 0;
      transition: filter 0.2s ease;
    }

    .button:hover {
      color: rgb(35, 51, 101);
      transform: translateY(-3px);
      filter: brightness(1.08);
    }

    .button:hover .button_icon { filter: brightness(1.5); }

    .window-controls {
      margin-top: 35px;
      margin-right: 85px;
      position: fixed;
      top: 8px; right: 10px;
      z-index: 10;
      display: flex;
      gap: 6px;
      user-select: none;
      -webkit-app-region: no-drag;
      transition: opacity 0.2s ease;
    }

    .wc-btn {
      width: 34px; height: 30px;
      border: none;
      border-radius: 8px;
      background: rgb(255, 254, 254);
      color: rgb(28, 39, 76);
      font-size: 18px;
      cursor: pointer;
      -webkit-app-region: no-drag;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .wc-btn:hover {
      color: rgb(35, 51, 101);
      background: rgb(255, 255, 255);
      transform: translateY(-1.5px);
      filter: brightness(1.08);
    }

    .backing {
      position: fixed;
      top: 30px; right: 80px; bottom: 30px; left: 80px;
      width: auto; height: auto;
      background: rgba(255, 254, 254, 0.4);
      border-radius: 20px;
      z-index: 2;
      pointer-events: none;
    }

    body.mini-mode #gradient,
    body.mini-mode .overlay,
    body.mini-mode .window-controls,
    body.mini-mode .backing {
      opacity: 0;
      pointer-events: none;
    }

    body.mini-mode #mini-avatar-wrap { display: flex; }

    #mini-avatar-wrap {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      overflow: hidden;
      align-items: flex-start;
      justify-content: center;
    }

    body.mini-mode #avatarCanvas {
      width: 160% !important;
      height: 180% !important;
      max-width: none !important;
      max-height: none !important;
      transform: translate(2%, -12%);
    }

    body.mini-mode #answerOverlay {
      font-size: 12px;
      left: 8px; right: 8px; bottom: 8px;
      padding: 7px 9px;
      border-radius: 10px;
      transform: none !important;
    }

    #btn-restore {
      position: absolute;
      top: 6px; right: 6px;
      width: 28px; height: 28px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 254, 254, 0.85);
      color: rgb(28, 39, 76);
      font-size: 14px;
      cursor: pointer;
      z-index: 21;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    #btn-restore:hover {
      transform: translateY(-1px);
      filter: brightness(1.1);
    }
  </style>
</head>

<body>
  <canvas id="gradient"></canvas>

  <div class="window-controls" id="windowControls">
    <button id="btn-minimize" class="wc-btn" aria-label="Свернуть">—</button>
    <button id="btn-close"    class="wc-btn" aria-label="Закрыть">✕</button>
  </div>

  <div class="overlay">
    <div class="ai-assistant">
      <canvas id="avatarCanvas"></canvas>
      <div id="answerOverlay"></div>
    </div>

    <div class="button_box">
      <div class="button" id="btn-settings">
        <img class="button_icon" src="./sources/icons/settings.svg" alt="">
        <span>Настройки</span>
      </div>
      <div class="button" id="btn-custom">
        <img class="button_icon" src="./sources/icons/custom.svg" alt="">
        <span>Кастомизация</span>
      </div>
      <div class="button" id="btn-log">
        <img class="button_icon" src="./sources/icons/log.svg" alt="">
        <span>Лог действий</span>
      </div>
    </div>
  </div>

  <div id="mini-avatar-wrap">
    <button id="btn-restore" aria-label="Развернуть" title="Развернуть">▲</button>
  </div>

  <div class="backing"></div>

  <script src="./node_modules/pixi.js/dist/pixi.min.js"></script>
  <script src="./live2dcubismcore.min.js"></script>
  <script src="./node_modules/pixi-live2d-display/dist/cubism4.min.js"></script>
  <script src="./avatar.js"></script>
  <script type="module" src="./design.js"></script>

  <script>
    const { ipcRenderer } = require('electron');

    document.getElementById('btn-minimize').addEventListener('click', () => {
      ipcRenderer.send('window-minimize');
    });
    document.getElementById('btn-close').addEventListener('click', () => {
      ipcRenderer.send('window-close');
    });
    document.getElementById('btn-restore').addEventListener('click', () => {
      ipcRenderer.send('window-restore');
    });

    document.getElementById('btn-settings').addEventListener('click', () => {
      ipcRenderer.send('open-window', 'settings.html');
    });
    document.getElementById('btn-custom').addEventListener('click', () => {
      ipcRenderer.send('open-window', 'custom.html');
    });
    document.getElementById('btn-log').addEventListener('click', () => {
      ipcRenderer.send('open-window', 'log.html');
    });

    const avatarCanvas  = document.getElementById('avatarCanvas');
    const answerOverlay = document.getElementById('answerOverlay');
    const aiAssistant   = document.querySelector('.ai-assistant');
    const miniWrap      = document.getElementById('mini-avatar-wrap');

    function enterMiniMode() {
      document.body.classList.add('mini-mode');
      miniWrap.appendChild(avatarCanvas);
      miniWrap.appendChild(answerOverlay);
    }

    function exitMiniMode() {
      document.body.classList.remove('mini-mode');
      aiAssistant.insertBefore(avatarCanvas, aiAssistant.firstChild);
      aiAssistant.appendChild(answerOverlay);
    }

    ipcRenderer.on('set-mini-mode', (event, isMini) => {
      isMini ? enterMiniMode() : exitMiniMode();
    });

    ipcRenderer.on('apply-settings', (event, settings) => {
      document.body.classList.toggle('no-subtitles', !settings.subtitles);
    });
  </script>
</body>
</html>
