<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Настройки</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #f4f1f8;
      color: #233365;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    h1 {
      margin: 0;
      padding: 28px 32px 16px;
      font-size: 22px;
      font-weight: 700;
      border-bottom: 1px solid #e0dcf0;
    }

    .settings-list {
      flex: 1;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .setting-label {
      font-size: 15px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .setting-desc {
      font-size: 12px;
      color: #7b82a8;
      margin-top: 2px;
    }

    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      max-width: 260px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: #c4c0f6;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #a59cf3;
      cursor: pointer;
      transition: background 0.2s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      background: #7b72e0;
    }

    .volume-value {
      font-size: 14px;
      font-weight: 700;
      min-width: 36px;
      text-align: right;
      color: #a59cf3;
    }

    .toggle {
      position: relative;
      width: 48px;
      height: 26px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      border-radius: 13px;
      background: #d0cce8;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle input:checked + .toggle-track {
      background: #a59cf3;
    }

    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: white;
      transition: transform 0.2s;
    }

    .toggle input:checked + .toggle-track::after {
      transform: translateX(22px);
    }

    .radio-group {
      display: flex;
      gap: 12px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .radio-option input[type="radio"] {
      accent-color: #a59cf3;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .divider {
      height: 1px;
      background: #e0dcf0;
    }

    .footer {
      padding: 16px 32px 24px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      border-top: 1px solid #e0dcf0;
    }

    .btn {
      padding: 10px 22px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.07);
    }

    .btn-save {
      background: #c4c0f6;
      color: #233365;
    }

    .btn-cancel {
      background: #e8e5f5;
      color: #233365;
    }

    .saved-hint {
      font-size: 13px;
      color: #a59cf3;
      align-self: center;
      opacity: 0;
      transition: opacity 0.3s;
      margin-right: auto;
    }

    .saved-hint.show { opacity: 1; }
  </style>
</head>
<body>

  <h1>Настройки</h1>

  <div class="settings-list">

    <div class="setting-row">
      <div>
        <div class="setting-label">Громкость ответа</div>
        <div class="setting-desc">Регулирует громкость голоса ассистента</div>
      </div>
      <div class="volume-wrap">
        <input type="range" id="volumeSlider" min="0" max="100" value="80">
        <span class="volume-value" id="volumeValue">80%</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="setting-row">
      <div>
        <div class="setting-label">Показывать субтитры</div>
        <div class="setting-desc">Отображать текст ответа под аватаром</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="toggleSubtitles" checked>
        <span class="toggle-track"></span>
      </label>
    </div>

    <div class="divider"></div>

    <div class="setting-row">
      <div>
        <div class="setting-label">Мини-аватар при сворачивании</div>
        <div class="setting-desc">Показывать аватар в углу, когда окно свёрнуто</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="toggleMiniMode" checked>
        <span class="toggle-track"></span>
      </label>
    </div>

    <div class="divider"></div>

    <div class="setting-row">
      <div>
        <div class="setting-label">Положение мини-аватара</div>
        <div class="setting-desc">В каком углу появляется аватар при сворачивании</div>
      </div>
      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" name="miniPosition" id="posLeft" value="left">
          Слева
        </label>
        <label class="radio-option">
          <input type="radio" name="miniPosition" id="posRight" value="right" checked>
          Справа
        </label>
      </div>
    </div>

  </div>

  <div class="footer">
    <span class="saved-hint" id="savedHint">✓ Сохранено</span>
    <button class="btn btn-cancel" id="btnCancel">Отмена</button>
    <button class="btn btn-save" id="btnSave">Сохранить</button>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const volumeSlider    = document.getElementById('volumeSlider');
    const volumeValue     = document.getElementById('volumeValue');
    const toggleSubtitles = document.getElementById('toggleSubtitles');
    const toggleMiniMode  = document.getElementById('toggleMiniMode');
    const posLeft         = document.getElementById('posLeft');
    const posRight        = document.getElementById('posRight');
    const btnSave         = document.getElementById('btnSave');
    const btnCancel       = document.getElementById('btnCancel');
    const savedHint       = document.getElementById('savedHint');

    volumeSlider.addEventListener('input', () => {
      volumeValue.textContent = volumeSlider.value + '%';
    });

    ipcRenderer.invoke('get-settings').then(settings => {
      if (!settings) return;
      volumeSlider.value        = settings.volume ?? 80;
      volumeValue.textContent   = volumeSlider.value + '%';
      toggleSubtitles.checked   = settings.subtitles ?? true;
      toggleMiniMode.checked    = settings.miniMode ?? true;
      (settings.miniPosition === 'left' ? posLeft : posRight).checked = true;
    });

    btnSave.addEventListener('click', () => {
      const settings = {
        volume:       parseInt(volumeSlider.value),
        subtitles:    toggleSubtitles.checked,
        miniMode:     toggleMiniMode.checked,
        miniPosition: posLeft.checked ? 'left' : 'right',
      };

      ipcRenderer.invoke('save-settings', settings).then(() => {
        savedHint.classList.add('show');
        setTimeout(() => savedHint.classList.remove('show'), 2000);
      });
    });

    btnCancel.addEventListener('click', () => {
      window.close();
    });

    ipcRenderer.send('resize-to-content', document.body.scrollHeight);
  </script>
</body>
</html>
